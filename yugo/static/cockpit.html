<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yugo cockpit</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0d12; color: #e6e9ef; font: 14px/1.4 system-ui, sans-serif; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 12px; height: 100vh; box-sizing: border-box; }
    .pane { background: #141821; border: 1px solid #232a36; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .pane h2 { margin: 0; padding: 8px 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8b94a7; border-bottom: 1px solid #232a36; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .side { display: grid; grid-template-rows: auto auto auto 1fr; gap: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .vitals { padding: 12px; display: grid; gap: 8px; }
    .row { display: flex; justify-content: space-between; }
    .k { color: #8b94a7; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #555; }
    .dot.on { background: #46d369; }
    pre { margin: 0; padding: 12px; overflow: auto; color: #aeb6c6; font-size: 12px; }
    #mood { font-weight: 600; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px; padding: 12px; }
    .key { aspect-ratio: 1; border: 1px solid #2a3242; border-radius: 10px; background: #1a1f2b;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-size: 20px; color: #cbd3e1; user-select: none; cursor: pointer; transition: all .08s; }
    .key small { font-size: 10px; color: #7a8298; margin-top: 2px; }
    .key.active { background: #1f6feb; border-color: #3b82f6; color: #fff; box-shadow: 0 0 12px #1f6feb88; transform: translateY(1px); }
    .key.up { grid-column: 2; grid-row: 1; }
    .key.left { grid-column: 1; grid-row: 2; }
    .key.down { grid-column: 2; grid-row: 2; }
    .key.right { grid-column: 3; grid-row: 2; }
    .stop { margin: 0 12px 12px; padding: 10px; border-radius: 8px; border: 1px solid #7f1d1d;
            background: #b91c1c; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .stop:active { background: #991b1b; }
  </style>
</head>
<body>
  <div class="grid">
    <section class="pane">
      <h2>Porthole — what Yugo sees</h2>
      <video id="video" autoplay playsinline muted></video>
    </section>
    <div class="side">
      <section class="pane">
        <h2>Device</h2>
        <div class="vitals mono">
          <div class="row"><span class="k">name</span><span id="dev-name">…</span></div>
          <div class="row"><span class="k">ip</span><span id="dev-ip">…</span></div>
          <div class="row"><span class="k">mac</span><span id="dev-mac">…</span></div>
          <div class="row"><span class="k">serial</span><span id="dev-serial">…</span></div>
        </div>
      </section>
      <section class="pane">
        <h2>Vitals</h2>
        <div class="vitals">
          <div class="row"><span class="k">link</span><span><span id="dot" class="dot"></span> <span id="conn">…</span></span></div>
          <div class="row"><span class="k">mode</span><span id="mode">…</span></div>
          <div class="row"><span class="k">mood</span><span id="mood">…</span></div>
          <div class="row"><span class="k">battery</span><span id="battery">—</span></div>
          <div class="row"><span class="k">webrtc</span><span id="pc">idle</span></div>
        </div>
      </section>
      <section class="pane">
        <h2>Drive — keyboard teleop</h2>
        <div class="pad">
          <div class="key up"    data-dir="up">▲<small>W / ↑</small></div>
          <div class="key left"  data-dir="left">◀<small>A / ←</small></div>
          <div class="key down"  data-dir="down">▼<small>S / ↓</small></div>
          <div class="key right" data-dir="right">▶<small>D / →</small></div>
        </div>
        <button class="stop" id="stopBtn">■ STOP (space)</button>
        <pre id="drive">hold W/A/S/D or arrows · space = stop · release = stop</pre>
      </section>
      <section class="pane">
        <h2>State stream</h2>
        <pre id="raw">connecting…</pre>
      </section>
    </div>
  </div>

  <script>
    // --- WebRTC video (WHIP-style single-shot signaling against /feed/offer) ---
    async function startVideo() {
      const pcEl = document.getElementById("pc");
      try {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.addTransceiver("video", { direction: "recvonly" });
        pc.ontrack = (e) => { document.getElementById("video").srcObject = e.streams[0]; };
        pc.onconnectionstatechange = () => { pcEl.textContent = pc.connectionState; };

        await pc.setLocalDescription(await pc.createOffer());
        // Wait for ICE gathering to finish so the offer bundles host candidates.
        await new Promise((resolve) => {
          if (pc.iceGatheringState === "complete") return resolve();
          pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && resolve();
        });

        const res = await fetch("/feed/offer", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
        });
        if (!res.ok) { pcEl.textContent = "offer " + res.status; return; }
        const answer = await res.json();
        await pc.setRemoteDescription(answer);
      } catch (err) {
        pcEl.textContent = "error";
        console.error(err);
      }
    }

    // --- Telemetry (/ws/state) ---
    function startState() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws/state`);
      ws.onmessage = (ev) => {
        const f = JSON.parse(ev.data);
        document.getElementById("raw").textContent = JSON.stringify(f, null, 2);
        const on = !!f.connected;
        document.getElementById("dot").className = "dot" + (on ? " on" : "");
        document.getElementById("conn").textContent = on ? "connected" : "offline";
        if (f.mode) document.getElementById("mode").textContent = f.mode;
        if (f.mood) {
          const m = f.mood;
          const el = document.getElementById("mood");
          el.textContent = `${m.label} (${m.scalar})`;
          el.style.color = m.color || "";
        }
        document.getElementById("battery").textContent =
          typeof f.battery === "number" ? Math.round(f.battery * 100) + "%" : "—";
      };
      ws.onclose = () => setTimeout(startState, 1000); // auto-reconnect
    }

    // --- Connected device identity (/robot/info, keyed by the known IP) ---
    async function loadDevice() {
      try {
        const d = await (await fetch("/robot/info")).json();
        document.getElementById("dev-name").textContent = d.name || (d.serial ? "Go2" : "—");
        document.getElementById("dev-ip").textContent = d.ip || "—";
        document.getElementById("dev-mac").textContent = d.mac || "—";
        document.getElementById("dev-serial").textContent = d.serial || "—";
      } catch (_) { /* leave placeholders */ }
    }

    // --- Drive: keyboard teleop (same-origin control endpoints) ---
    // Each nudge drives for the deadman window (~0.5s); holding re-pokes every 150ms so
    // motion stays continuous, and release/blur posts /stop (deadman is the backstop).
    // One direction at a time — last key pressed wins.
    const KEYMAP = {
      w: "up", s: "down", a: "left", d: "right",
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    };
    const REPEAT_MS = 150;
    const driveOut = document.getElementById("drive");
    const held = [];          // keys/dirs down, in press order (last = active)
    let timer = null;
    let lastResp = null;

    function activeDir() {
      for (let i = held.length - 1; i >= 0; i--) {
        const d = KEYMAP[held[i]] || held[i];
        if (d) return d;
      }
      return null;
    }
    async function post(path) {
      try { lastResp = await (await fetch(path, { method: "POST" })).json(); }
      catch (e) { lastResp = { ok: false, error: String(e) }; }
      render();
    }
    function tick() { const d = activeDir(); if (d) post("/" + d); }
    function ensureTimer() { if (!timer) { tick(); timer = setInterval(tick, REPEAT_MS); } }
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
    function setActive(dir, on) {
      document.querySelectorAll(`.key[data-dir="${dir}"]`).forEach(el => el.classList.toggle("active", on));
    }
    function render() {
      driveOut.textContent =
        `active: ${activeDir() || "—"}    held: [${held.join(",")}]\n` +
        `last response: ${lastResp ? JSON.stringify(lastResp) : "—"}`;
    }
    function press(token, dir) {
      if (held.includes(token)) return;   // ignore OS auto-repeat / double-down
      held.push(token);
      setActive(dir, true);
      ensureTimer();
      render();
    }
    function release(token, dir) {
      const i = held.indexOf(token);
      if (i >= 0) held.splice(i, 1);
      if (!held.some(k => (KEYMAP[k] || k) === dir)) setActive(dir, false);
      if (held.length === 0) { stopTimer(); post("/stop"); }
      else render();
    }
    function panicStop() {
      held.length = 0;
      stopTimer();
      document.querySelectorAll(".key").forEach(el => el.classList.remove("active"));
      post("/stop");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === " ") { e.preventDefault(); panicStop(); return; }
      const dir = KEYMAP[e.key];
      if (!dir) return;
      e.preventDefault();                 // stop arrow-key page scroll
      press(e.key, dir);
    });
    window.addEventListener("keyup", (e) => {
      const dir = KEYMAP[e.key];
      if (dir) release(e.key, dir);
    });
    window.addEventListener("blur", panicStop);   // lose focus -> stop (safety)
    document.getElementById("stopBtn").addEventListener("click", panicStop);

    // On-screen pad: pointer = mouse + touch; the dir doubles as the held token.
    document.querySelectorAll(".key").forEach(el => {
      const dir = el.dataset.dir;
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); press(dir, dir); });
      el.addEventListener("pointerup", (e) => { e.preventDefault(); release(dir, dir); });
      el.addEventListener("pointerleave", () => { if (held.includes(dir)) release(dir, dir); });
    });

    startVideo();
    startState();
    loadDevice();
  </script>
</body>
</html>
