# =============================================================================
# Yugo Body API — OpenAPI 3.1 contract for the local FastAPI hub ("the body")
# -----------------------------------------------------------------------------
# This file is the AUTHORITATIVE surface contract that the Yugo app (React
# Native) and other LAN clients code against. It describes the body: a single
# light FastAPI process on the dog's LAN that holds the WebRTC LocalSTA link to
# Yugo (Go2 Air), executes all control LOCALLY, and DELEGATES every "think" step
# to the cloud mind (OpenAI reasoning, perception, ElevenLabs voice/music).
#
# Body  = I/O + control + fast/reflex loop  (this API).
# Mind  = intelligence; reached via /agent/say, perception sampling, audio cues.
#
# Each operation carries `x-execution: local | delegates-to-mind` and states in
# its description whether it runs over WebRTC on the robot or calls the cloud.
#
# Source files this spec documents:
#   yugo/ (main.py + routers/SystemRouter,ControlRouter)   [port 8080, CANONICAL]
#     system  -> /healthz, /tricks
#     actions -> /actions, /hello, /wiggle, /heart, /sit, /standup, /standdown,
#                /stretch, /dance, /trick/{name}     (need the robot; 503 offline)
#     reflex  -> /up, /down, /left, /right, /cmd_vel, /stop, /state
#                (LOCAL deadman-guarded teleop; work offline, publish if connected)
#   yugo/bridge/web_bridge.py                          [port 5555, DEPRECATED]
#     -> /healthz, /debug, /cmd_vel, /stop, /video_feed/color_image
#        (legacy DimOS camera+teleop bridge with its own 0.4 s deadman loop)
# Everything else is PLANNED (target surface per prd/architecture-body.md).
#
# NOTE (reconciled 2026-05-29): the offline control surface — expressive actions,
# keyboard nav, and the deadman-guarded teleop — is now UNIFIED on the hub
# (port 8080) as one router. The deadman + /cmd_vel formerly lived only on the
# WebBridge; the hub is now canonical.
#
# DEPRECATION (this release): yugo/bridge/web_bridge.py is DEPRECATED. Its teleop
# /cmd_vel + /stop + deadman are superseded by the hub. Only the MJPEG camera
# (/video_feed/color_image) has no hub equivalent yet — that capability is the
# sole remaining reason to run the bridge, and it will move to the hub
# (telemetry) before the bridge is removed. Do not build new clients against
# :5555. See yugo/bridge/web_bridge.py header for the migration map.
# =============================================================================

openapi: 3.1.0

info:
  title: Yugo Body API
  version: 0.1.0
  description: |
    **The body** is Yugo's nervous system: a single light FastAPI on the dog's
    LAN that owns the one WebRTC `LocalSTA` link to the Go2 Air, executes all
    control locally and fast, serves the app, and runs the agent loop — but
    **delegates every intelligence step to the mind (cloud)**.

    - **Body (this API)** = robot I/O, local control, reflex/safety loop, state
      aggregation, app contract.
    - **Mind (cloud)** = LLM reasoning (OpenAI), perception (vision/detectors),
      voice & music generation (ElevenLabs). The body carries *text*, not audio.

    Routes are tagged into groups (control, telemetry, agent, sensor, audio,
    system) and each operation declares `x-execution`:
    `local` (runs over WebRTC on the robot) or `delegates-to-mind` (calls cloud).

    ## No auth — LAN tool
    This is a local LAN/Tailscale tool and ships with **no authentication** by
    design. Do **not** expose its port to the public internet. An empty,
    optional security scheme is declared (`security: [{}]`) purely to make the
    "no auth required" contract explicit for code generators.

    ## Three hard constraints (from live testing 2026-05-28/29)
    1. **BalanceStand precondition.** Expressive `SPORT_CMD` moves (e.g.
       `WiggleHips`) are *ignored* unless Yugo is upright. The body gates them
       behind an auto-`BalanceStand`. `Hello` works from most states.
    2. **The WebRTC data channel can drop** mid-session and does NOT self-heal.
       `GET /healthz` MUST reflect the **live** channel state (not just the
       initial handshake), and the body **auto-reconnects**.
    3. **`ok` ≠ executed.** Publishing a `SPORT_CMD` returns success even if the
       dog ignores it (no execution ack). Telemetry/state — not the publish
       result — is the source of truth.

    ## Degradation
    If the mind/network is unreachable, the body keeps the reflex/deadman loop
    and a safe local command set (stand/sit/stop) alive: a cloud blip never
    strands Yugo mid-demo. `delegates-to-mind` routes may return `502`.
  contact:
    name: Yugo / dimos
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: yugo.main:app — canonical body API (default port 8080).
  - url: http://localhost:5555
    description: |
      DEPRECATED — yugo/bridge/web_bridge.py WebBridge (default port 5555). Its
      teleop/deadman are superseded by the hub (:8080); only the MJPEG camera
      remains. Do not target this server for new clients.

# No auth: empty security requirement object => the API may be called with no
# credentials. Declared at the document level so it applies to every operation.
security:
  - {}

tags:
  - name: system
    description: Liveness, capability discovery, and connection health.
  - name: control
    description: |
      Local motion & expression, unified on the hub as one router. Two layers
      with different safety stances:

      - **Expressive actions** (`/hello`, `/wiggle`, `/heart`, `/sit`,
        `/standup`, `/standdown`, `/stretch`, `/dance`, `/trick/{name}`) EXECUTE
        ON THE ROBOT over WebRTC and require the link — they return `503` when
        the dog is disconnected (hard constraint #2). Their name→api_id mapping
        is discoverable offline via `GET /actions`.
      - **Reflex teleop** (`/up`, `/down`, `/left`, `/right`, `/cmd_vel`,
        `/stop`) is the LOCAL deadman/nav state machine. It always responds
        `200` and publishes to the dog only while connected, so the body stays
        controllable and the deadman stays observable (`GET /state`) even with
        the link down.

      All motion is velocity-clamped and deadman-guarded. Nav is a timed nudge:
      one call drives for the deadman window (`command_timeout`, default 0.5 s),
      then auto-zeroes; re-call within the window to keep moving. `POST /stop`
      zeroes immediately.
  - name: telemetry
    description: |
      Live state and media out of the body — the camera MJPEG stream and the
      `/ws/state` WebSocket that drives the app's "aura".
  - name: agent
    description: |
      Yugo's conversational brain. The primary path is a **body-hosted OpenAI Realtime
      session** (voice in/out + tool calls that execute **in-process** against the
      controllers — see `prd/module-realtime-session.md`); the cloud is only a thin
      STT/vision context wrapper. `POST /agent/say` here is the **text-only fallback**
      into that same persona + tool layer.
  - name: sensor
    description: |
      Inbound sensor ingest — the phone acting as a "wand" (magnetometer / IMU /
      light / gesture) to drive mood, music, and robot reactions.
  - name: audio
    description: |
      Soundscape / SFX / music TRIGGERS. Audio is generated by the mind
      (ElevenLabs) and played app/laptop-side — bytes never traverse the body.

paths:

  # ===========================================================================
  # SYSTEM
  # ===========================================================================
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness + live WebRTC connection health
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `SystemRouter`; the deprecated WebBridge also
        exposes a `/healthz` with `have_frame`/`last_cmd_age_s`).

        **What it does:** returns the body's liveness plus the **live** state of
        the WebRTC link to Yugo. This is a read-only status probe and has **no
        side effects** on the robot.

        **Execution:** local. It inspects the in-process WebRTC connection /
        data-channel state; it does not call the cloud.

        **Critical contract (hard constraint #2):** the data channel can drop
        mid-session and does not self-heal, so `connected` MUST reflect the
        *current* channel state — not merely that the initial handshake once
        succeeded. The body auto-reconnects in the background; clients should
        poll this and treat **expressive action** routes as unavailable (`503`)
        while `connected` is false. (Reflex teleop stays `200` regardless — see
        `GET /state`.)

        **Latency:** sub-millisecond (in-memory).

        > The hub returns `{ok, robot_ip, connected}`. Motion/deadman fields
        > (`last_cmd_age_s`, effective velocity, deadman window) live on
        > `GET /state`. The `channel`/`have_frame` fields are
        > deprecated-WebBridge/planned and not part of the hub shape.
      responses:
        '200':
          description: Body is alive. Inspect fields for live robot/channel state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                connected:
                  summary: Channel up
                  value:
                    ok: true
                    robot_ip: "192.168.203.75"
                    connected: true
                dropped:
                  summary: Handshake done but data channel dropped (auto-reconnecting)
                  value:
                    ok: true
                    robot_ip: "192.168.203.75"
                    connected: false
                offline:
                  summary: Running offline (YUGO_NO_ROBOT) — reflex layer still live
                  value:
                    ok: true
                    robot_ip: "192.168.203.75"
                    connected: false

  /tricks:
    get:
      tags: [system]
      operationId: getTricks
      summary: List available SPORT_CMD move names
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `SystemRouter`).

        **What it does:** returns the sorted list of `SPORT_CMD` move names the
        robot understands (e.g. `Hello`, `WiggleHips`, `Stretch`, `FingerHeart`,
        `BalanceStand`, `RecoveryStand`, …). These are the valid values for the
        `name` path parameter of `POST /trick/{name}`. For the curated set of
        friendly named action routes (and their api_ids), see `GET /actions`.

        **Execution:** local — reads the static `SPORT_CMD` table; no robot
        traffic, no side effects.

        **Latency:** sub-millisecond.
      responses:
        '200':
          description: The set of known move names.
          content:
            application/json:
              schema:
                type: object
                required: [tricks]
                properties:
                  tricks:
                    type: array
                    items: { type: string }
              examples:
                sample:
                  value:
                    tricks: ["BalanceStand", "FingerHeart", "Hello", "RecoveryStand", "Stretch", "WiggleHips"]

  # ===========================================================================
  # CONTROL — EXPRESSIVE ACTIONS  (x-execution: local; require the robot → 503)
  # ===========================================================================
  /actions:
    get:
      tags: [control]
      operationId: getActions
      summary: List the friendly named action routes
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`).

        **What it does:** returns the curated set of friendly action routes
        (`hello`, `wiggle`, `heart`, `sit`, `standup`, `standdown`, `stretch`,
        `dance`) with the canonical `SPORT_CMD` move each maps to and its numeric
        `api_id`. Each entry `name` is reachable as `POST /{name}`.

        **Execution:** local — reads the static mapping; no robot traffic.
        Works **offline** (no link required), so it is the offline-validatable
        source of truth for the action→api_id contract.

        **Latency:** sub-millisecond.
      responses:
        '200':
          description: The friendly action catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionsResponse' }
              examples:
                sample:
                  value:
                    actions:
                      - { name: "hello", move: "Hello", api_id: 1016 }
                      - { name: "wiggle", move: "WiggleHips", api_id: 1033 }
                      - { name: "heart", move: "FingerHeart", api_id: 1036 }
                      - { name: "sit", move: "Sit", api_id: 1009 }
                      - { name: "standup", move: "StandUp", api_id: 1004 }
                      - { name: "standdown", move: "StandDown", api_id: 1005 }

  /hello:
    post:
      tags: [control]
      operationId: postHello
      summary: Wave hello (fires SPORT_CMD Hello)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action route — fires the
        `Hello` move. `Hello` works from most states (no BalanceStand
        precondition). See the shared action contract below.

        **Action route contract (shared by all named actions):**
        - No request body. Publishes the mapped `SPORT_CMD` over WebRTC.
        - `ok` ≠ executed (hard constraint #3): `200` means PUBLISHED, not that
          the dog executed it.
        - Requires the link: returns `503` while disconnected (constraint #2).
        - Expressive moves are gated behind an upright stance (constraint #1).
      responses:
        '200':
          description: Move PUBLISHED (not necessarily executed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "Hello", api_id: 1016 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /wiggle:
    post:
      tags: [control]
      operationId: postWiggle
      summary: Wiggle hips (fires SPORT_CMD WiggleHips)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `WiggleHips`.
        Expressive: ignored unless upright (auto-`BalanceStand` gate, constraint
        #1). See the action route contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "WiggleHips", api_id: 1033 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /heart:
    post:
      tags: [control]
      operationId: postHeart
      summary: Finger heart (fires SPORT_CMD FingerHeart)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `FingerHeart`.
        Expressive (constraint #1). See the contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "FingerHeart", api_id: 1036 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /sit:
    post:
      tags: [control]
      operationId: postSit
      summary: Sit (fires SPORT_CMD Sit)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `Sit`. Posture
        change. See the contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "Sit", api_id: 1009 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /standup:
    post:
      tags: [control]
      operationId: postStandUp
      summary: Stand up (fires SPORT_CMD StandUp)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `StandUp`. Posture
        change (a safe local command). See the contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "StandUp", api_id: 1004 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /standdown:
    post:
      tags: [control]
      operationId: postStandDown
      summary: Stand down / lie (fires SPORT_CMD StandDown)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `StandDown`.
        Posture change. See the contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "StandDown", api_id: 1005 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /stretch:
    post:
      tags: [control]
      operationId: postStretch
      summary: Stretch (fires SPORT_CMD Stretch)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Named action → `Stretch`.
        Expressive (constraint #1). See the contract under `POST /hello`.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "Stretch", api_id: 1017 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /dance:
    post:
      tags: [control]
      operationId: postDance
      summary: Dance (fires SPORT_CMD Dance1)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`) — named action → `Dance1`, a
        canned dance move. See the action contract under `POST /hello`.

        **PLANNED extension:** an optional `{bpm, style}` body for beat-synced
        choreography (sequenced poses/heights synced to the beat the body holds,
        running as a routine until `POST /stop`). When that lands, a body-less
        call keeps firing `Dance1`. All motion stays clamped/deadman-guarded.
      responses:
        '200':
          description: Move PUBLISHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published: { value: { ok: true, move: "Dance1", api_id: 1022 } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  # ===========================================================================
  # CONTROL — REFLEX TELEOP  (x-execution: local; deadman-guarded, work offline)
  # ===========================================================================
  /cmd_vel:
    post:
      tags: [control]
      operationId: postCmdVel
      summary: Raw velocity teleop (clamped, deadman-guarded)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`; also on the deprecated WebBridge).

        **What it does:** sets the target body velocity as the held command.
        While connected, the body re-publishes the *effective* (deadman-adjusted)
        velocity to the robot at `publish_hz` (~20 Hz).

        **Execution:** local — published over WebRTC LocalSTA when connected.
        This is reflex layer: it responds `200` even **offline** (no link), so
        the deadman/state machine stays controllable; it simply does not reach
        the dog (`connected:false` in the response). Inspect `GET /state`.

        **Side effects:** Yugo MOVES (when connected). Ensure clear space.

        **Safety:**
        - **Clamps:** `vx`/`vy` to ±0.6 m/s, `wz` to ±1.2 rad/s. Out-of-range
          values are clamped, not rejected — the response echoes the accepted
          (clamped) values.
        - **Deadman watchdog:** the held command is honoured only while younger
          than `command_timeout` (**default 0.5 s**); past the window the body
          goes to zero (safe stop). Re-send at a steady cadence to keep moving.

        **Latency:** LAN-local, a few ms; motion applied on the next publish tick.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Velocity'
            examples:
              forward:
                summary: Drive forward, gentle left turn
                value: { vx: 0.3, vy: 0.0, wz: 0.4 }
      responses:
        '200':
          description: Command accepted; response echoes the clamped velocity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                clamped:
                  summary: Out-of-range input clamped to the envelope
                  value: { ok: true, action: "cmd_vel", vx: 0.6, vy: 0.0, wz: 1.2, duration_s: 0.5, connected: true }

  /up:
    post:
      tags: [control]
      operationId: postNavUp
      summary: Nudge forward (keyboard nav)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`).

        **What it does:** a timed-nudge forward step — sets `+vx` (=`linear_step`)
        as the held velocity. The body drives for the deadman window
        (`command_timeout`, default 0.5 s) then auto-zeroes; re-call within the
        window (key-repeat / hold) to keep moving.

        **Nav route contract (shared by `/up`,`/down`,`/left`,`/right`):**
        reflex layer — always `200`, publishes only while connected, clamped and
        deadman-guarded. Response is a `MoveResult` echoing the accepted velocity
        and the `duration_s` the nudge holds. Observe live state via `GET /state`.
      responses:
        '200':
          description: Nudge accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                up: { value: { ok: true, action: "up", vx: 0.4, vy: 0.0, wz: 0.0, duration_s: 0.5, connected: true } }

  /down:
    post:
      tags: [control]
      operationId: postNavDown
      summary: Nudge backward (keyboard nav)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Timed-nudge `-vx`. See the nav
        route contract under `POST /up`.
      responses:
        '200':
          description: Nudge accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                down: { value: { ok: true, action: "down", vx: -0.4, vy: 0.0, wz: 0.0, duration_s: 0.5, connected: true } }

  /left:
    post:
      tags: [control]
      operationId: postNavLeft
      summary: Nudge turn left / CCW (keyboard nav)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Timed-nudge `+wz` (yaw CCW,
        =`angular_step`). See the nav route contract under `POST /up`.
      responses:
        '200':
          description: Nudge accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                left: { value: { ok: true, action: "left", vx: 0.0, vy: 0.0, wz: 0.8, duration_s: 0.5, connected: true } }

  /right:
    post:
      tags: [control]
      operationId: postNavRight
      summary: Nudge turn right / CW (keyboard nav)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Timed-nudge `-wz` (yaw CW). See
        the nav route contract under `POST /up`.
      responses:
        '200':
          description: Nudge accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                right: { value: { ok: true, action: "right", vx: 0.0, vy: 0.0, wz: -0.8, duration_s: 0.5, connected: true } }

  /stop:
    post:
      tags: [control]
      operationId: postStop
      summary: Panic stop (zero velocity immediately)
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`; also on the deprecated WebBridge).

        **What it does:** the always-available panic/stop. Immediately zeroes the
        held velocity (and pushes a zero to the dog when connected), so the body
        comes to rest at once rather than waiting out the deadman window.

        **Execution:** local. Reflex layer — responds `200` even **offline**
        (it always zeroes local state; it reaches the dog only when connected).

        **Side effects:** Yugo stops moving. (It does not change stance; use a
        posture action such as `POST /standup` for that.)

        **Safety:** this is the highest-priority safety command and keeps working
        even when the link or the mind is down.

        **Latency:** immediate.
      responses:
        '200':
          description: Stop applied (velocity zeroed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResult' }
              examples:
                stopped: { value: { ok: true, action: "stop", vx: 0.0, vy: 0.0, wz: 0.0, duration_s: 0.5, connected: true } }

  /state:
    get:
      tags: [telemetry]
      operationId: getState
      summary: Live motion + deadman state
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`).

        **What it does:** returns the body's live motion/deadman state. The
        deadman is **observable here**: `vx`/`vy`/`wz` are the *effective*
        (deadman-adjusted) velocity computed at read time, so once the window
        (`deadman_window`) has elapsed since the last command they read `0` and
        `moving` is `false`. `raw_*` is the last commanded velocity before the
        window is applied; `last_cmd_age_s` is the age of that command (null if
        none yet).

        **Execution:** local, read-only, no robot traffic. Works offline.

        **Latency:** sub-millisecond. Poll this to verify nav/teleop/deadman
        behaviour over HTTP.
      responses:
        '200':
          description: Live motion state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MotionState' }
              examples:
                moving:
                  summary: Fresh command — body is moving
                  value:
                    moving: true
                    vx: 0.4
                    vy: 0.0
                    wz: 0.0
                    raw_vx: 0.4
                    raw_vy: 0.0
                    raw_wz: 0.0
                    last_cmd_age_s: 0.12
                    deadman_window: 0.5
                    connected: true
                deadman_zeroed:
                  summary: Past the window — deadman has zeroed the body
                  value:
                    moving: false
                    vx: 0.0
                    vy: 0.0
                    wz: 0.0
                    raw_vx: 0.4
                    raw_vy: 0.0
                    raw_wz: 0.0
                    last_cmd_age_s: 0.74
                    deadman_window: 0.5
                    connected: false

  /trick/{name}:
    post:
      tags: [control]
      operationId: postTrick
      summary: Fire a SPORT_CMD move
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `ControlRouter`). Generic escape hatch for any move
        not promoted to a friendly `/actions` route.

        **What it does:** publishes a single `SPORT_CMD` move (looked up by
        `name` against the `/tricks` table) to `RTC_TOPIC["SPORT_MOD"]`.

        **Execution:** local over WebRTC.

        **Side effects:** Yugo performs the move (large body motion). Clear space.

        **Safety / preconditions (hard constraint #1):** expressive moves such as
        `WiggleHips` are **ignored unless Yugo is upright**. The body gates these
        behind an auto-`BalanceStand` precondition. `Hello` works from most
        states. Tricks should additionally be gated behind a client
        "clear-space" acknowledgement.

        **`ok` ≠ executed (hard constraint #3):** a `200 {ok:true}` means the
        command was **PUBLISHED**, not that the dog **EXECUTED** it — there is no
        execution ack. Confirm via `/ws/state` telemetry, not this response.

        **Latency:** publish is a few ms LAN-local; physical execution takes
        as long as the move (~1–3 s).
      parameters:
        - name: name
          in: path
          required: true
          description: Move name; must be one of `GET /tricks`.
          schema: { type: string }
          examples:
            wave: { value: "Hello" }
            wiggle: { value: "WiggleHips" }
      responses:
        '200':
          description: Move PUBLISHED (not necessarily executed — see description).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrickResult' }
              examples:
                published:
                  value: { ok: true, move: "WiggleHips", api_id: 1033 }
        '404':
          $ref: '#/components/responses/UnknownMove'
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /led:
    post:
      tags: [control]
      operationId: postLed
      summary: Set front-lamp color / effect (PLANNED)
      x-execution: local
      description: |
        **PLANNED.**

        **What it does:** sets Yugo's front lamp via the VUI topic — a solid
        mood `color` or a named `effect` (e.g. a strobe effect).

        **Execution:** local over WebRTC (VUI topic publish).

        **Side effects:** changes the front-lamp output only; no motion.

        **Safety:** no motion; safe at any time. Strobe effects should be used
        sparingly (photosensitivity).

        **Latency:** LAN-local, a few ms.

        Provide either `color` or `effect`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                color:
                  type: string
                  description: CSS/hex color, e.g. "#33ccff" or "red".
                effect:
                  type: string
                  description: Named effect, e.g. "strobe", "breathe", "off".
              anyOf:
                - required: [color]
                - required: [effect]
            examples:
              moodColor: { value: { color: "#33ccff" } }
              strobe: { value: { effect: "strobe" } }
      responses:
        '200':
          description: Lamp updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /mode:
    post:
      tags: [control]
      operationId: postMode
      summary: Set the active behavior mode (PLANNED)
      x-execution: local
      description: |
        **PLANNED.**

        **What it does:** sets the body's active behavior mode, which colors how
        Yugo reacts to wand/agent input (LED palette, motion tendencies, music
        coupling). The mode is reflected in `/ws/state`.

        **Execution:** local — a body-side state switch that conditions
        subsequent local behavior (may publish LED/posture changes over WebRTC).

        **Side effects:** may change lamp/posture immediately depending on mode;
        does not by itself drive locomotion.

        **Safety:** mode change alone does not move the dog; motion still flows
        through the clamped/deadman-guarded paths.

        **Latency:** LAN-local, a few ms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [creature, personal, friend, find, wand, meditation]
            examples:
              personal: { value: { mode: "personal" } }
      responses:
        '200':
          description: Mode set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      mode:
                        type: string
                        enum: [creature, personal, friend, find, wand, meditation]
              examples:
                ok: { value: { ok: true, mode: "personal" } }
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /breathe:
    post:
      tags: [control]
      operationId: postBreathe
      summary: Slow body-height oscillation for meditation (PLANNED)
      x-execution: local
      description: |
        **PLANNED.**

        **What it does:** toggles a slow, calm body-height oscillation
        ("breathing") used in meditation mode. `on:true` starts it at `rate`
        cycles/min; `on:false` stops it.

        **Execution:** local — oscillates body height over WebRTC.

        **Side effects:** gentle, low-amplitude vertical body motion only; no
        locomotion.

        **Safety:** low-amplitude; clamped; `POST /stop` ends it. Requires an
        upright stance (BalanceStand precondition).

        **Latency:** LAN-local; oscillation cadence set by `rate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on:
                  type: boolean
                  description: Start (true) or stop (false) the breathing motion.
                rate:
                  type: number
                  description: Cycles per minute (breaths/min). Ignored when on=false.
                  minimum: 1
                  maximum: 30
            examples:
              start: { value: { on: true, rate: 6 } }
              stop: { value: { on: false } }
      responses:
        '200':
          description: Breathing toggled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  # ===========================================================================
  # TELEMETRY
  # ===========================================================================
  /video_feed/color_image:
    get:
      tags: [telemetry]
      operationId: getVideoFeedColorImage
      summary: MJPEG camera stream
      x-execution: local
      description: |
        **IMPLEMENTED** (web_bridge.py).

        **What it does:** serves the robot's color camera as a continuous
        `multipart/x-mixed-replace` MJPEG stream (boundary `frame`). Open it in
        an `<img>` tag or an MJPEG-capable player.

        **Execution:** local — frames arrive over WebRTC, are JPEG-encoded by
        the body, and pushed to the client. The body also samples frames
        (~1–3 fps) to send to the mind for perception, but that is internal and
        not part of this stream.

        **Side effects:** none on the robot (read-only).

        **Safety:** read-only.

        **Latency:** near real-time; frames pushed at up to ~30 fps. Before the
        first frame arrives the stream yields nothing (check `have_frame` on
        `/healthz`).
      responses:
        '200':
          description: An open MJPEG multipart stream.
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
                description: |
                  Repeating `--frame` parts, each `Content-Type: image/jpeg`
                  followed by the JPEG bytes.

  /ws/state:
    get:
      tags: [telemetry]
      operationId: getWsState
      summary: Live state WebSocket (~10–20 Hz push)
      x-execution: local
      description: |
        **PLANNED.** Documented here as an operation; this endpoint is a
        **WebSocket upgrade**, not a plain HTTP GET. Connect with `ws://` (e.g.
        `ws://localhost:5555/ws/state`).

        **What it does:** after the upgrade, the body **pushes** an aggregated
        state frame at ~10–20 Hz. This drives the app's "aura". The payload
        merges robot telemetry with the latest results returned by the mind
        (mood/detections).

        Each pushed message conforms to `StateFrame`:
        `battery`, `pose`/`imu`, `mode`, `mood {scalar,label,color}`,
        `detections [{label,bbox,confidence}]`, `person_count`, `audio_level`.

        **Execution:** local — the body aggregates and pushes; perception fields
        originate from the mind but are delivered here by the body.

        **Side effects:** none (read-only stream).

        **Safety:** read-only.

        **Latency:** push cadence ~10–20 Hz; mind-sourced fields (detections,
        mood) update at the perception tier's slower rate.
      responses:
        '101':
          description: Switching Protocols — WebSocket established; server pushes `StateFrame` messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateFrame' }
              examples:
                frame:
                  value:
                    battery: 0.82
                    pose: { x: 0.0, y: 0.0, z: 0.31, roll: 0.01, pitch: -0.02, yaw: 1.57 }
                    imu: { ax: 0.0, ay: 0.0, az: 9.81, gx: 0.0, gy: 0.0, gz: 0.0 }
                    mode: "creature"
                    mood: { scalar: 0.7, label: "curious", color: "#ffcc44" }
                    detections:
                      - { label: "person", bbox: [120, 60, 240, 380], confidence: 0.91 }
                    person_count: 1
                    audio_level: 0.34

  # ===========================================================================
  # AGENT  (delegates-to-mind)
  # ===========================================================================
  /agent/say:
    post:
      tags: [agent]
      operationId: postAgentSay
      summary: Text fallback into the body-hosted Realtime brain (PLANNED)
      x-execution: delegates-to-mind
      description: |
        **PLANNED.**

        > **Design note:** the primary "talk" path is now a **body-hosted OpenAI Realtime
        > session** (voice + in-process tool calls — see `prd/module-realtime-session.md`).
        > This route is the **text-only fallback** into that same persona + tool layer:
        > reasoning is cloud (OpenAI), but tool execution runs in-process on the body.

        **What it does:** forwards a recognized utterance `text` (from the app's
        Deepgram STT) plus context (recent detections, mood, state) to the cloud
        agent (OpenAI). The mind returns a short reply line and a behavior
        intent; the body then **applies that behavior locally** (move / trick /
        LED / mode) and returns `{reply_text, behavior}`.

        **Execution:** **delegates-to-mind** for the reasoning, then **local**
        for the resulting behavior over WebRTC. The app speaks `reply_text` via
        ElevenLabs TTS — this route returns text only, never audio.

        **Side effects:** the returned behavior may MOVE Yugo or change its
        lamp/mode. Same safety gating applies (clamps, deadman, BalanceStand,
        clear-space).

        **Safety / degradation:** if the mind is unreachable, returns `502`; the
        body stays safe (reflex/deadman keep running) and falls back to the safe
        local command set.

        **Latency:** dominated by the cloud round-trip (~0.5–3 s depending on
        region/model); the mind streams so first words come back quickly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The recognized utterance to feed the agent.
            examples:
              greet: { value: { text: "Yugo, say hi to everyone" } }
      responses:
        '200':
          description: Agent reply + applied behavior.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReply' }
              examples:
                reply:
                  value:
                    reply_text: "Yugo waves a happy hello."
                    behavior: { type: "trick", name: "Hello" }
        '502':
          $ref: '#/components/responses/MindUnreachable'
        '503':
          $ref: '#/components/responses/RobotNotConnected'

  /say:
    post:
      tags: [agent]
      operationId: postSay
      summary: Broadcast a scripted caption on /ws/state (PLANNED)
      x-execution: local
      description: |
        **PLANNED.**

        **What it does:** forces a scripted line as a caption + behavior cue,
        broadcast on the `/ws/state` stream. Unlike `/agent/say` this does **no**
        reasoning and produces **no audio** — audio playback is app-side
        (ElevenLabs). Use it for canned lines.

        **Execution:** local — no cloud call; the body just broadcasts the
        caption (and may apply an associated local cue).

        **Side effects:** updates the caption seen by `/ws/state` subscribers;
        no motion unless a cue is attached.

        **Safety:** no audio, no required motion.

        **Latency:** LAN-local, a few ms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: The caption/line to broadcast.
            examples:
              caption: { value: { text: "Yugo is watching." } }
      responses:
        '200':
          description: Caption broadcast.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }

  # ===========================================================================
  # SENSOR
  # ===========================================================================
  /sensor:
    post:
      tags: [sensor]
      operationId: postSensor
      summary: Ingest phone "wand" sensor readings
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `SensorRouter`) — minimal for now: validates and keeps
        the latest reading on `app.state`; richer reactions are planned.

        **What it does:** ingests a reading from the phone acting as a "wand" —
        magnetometer, accelerometer, ambient light, and an optional discrete
        gesture, with a client timestamp. The body uses these to drive
        sonification cues, mood/mode reactions (Yugo turns/flares toward a
        magnetic field), and music triggers (e.g. `gesture:"wave"` starts or
        changes the track).

        **Execution:** local — the body maps readings to local reactions; some
        reactions (motion/LED) are published over WebRTC, and a music gesture may
        in turn trigger a `delegates-to-mind` audio cue.

        **Side effects:** may cause Yugo to turn/flare or update mood; may start
        music. Motion still flows through the clamped/deadman paths.

        **Safety:** mapped reactions are bounded by the same clamps; `/stop`
        overrides.

        **Latency:** LAN-local; intended to be sent at a steady stream rate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorReading' }
            examples:
              wave:
                summary: A "wave" gesture with field + light
                value:
                  source: "phone-wand"
                  magnetometer: { x: 12.3, y: -4.1, z: 40.2 }
                  accel: { x: 0.1, y: 0.0, z: 9.8 }
                  light: 320
                  gesture: "wave"
                  ts: 1716960000.123
      responses:
        '200':
          description: Reading ingested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }
        '422':
          $ref: '#/components/responses/ValidationError'

  /sensor/spell:
    post:
      tags: [sensor]
      operationId: postSensorSpell
      summary: Cast a spell — magnetometer trace → deterministic trick
      x-execution: local
      description: |
        **IMPLEMENTED** (hub `SensorRouter` + `SensorController` hash engine).

        **What it does:** the ★ wand mechanic. Takes the **magnetometer trace** of
        one phone gesture (press → sweep → release), normalizes it, extracts
        quantized features, hashes them to a stable bucket (`sha256` — not Python's
        salted `hash()`), looks the bucket up in a fixed trick table, and fires that
        `SPORT_CMD` move on Yugo. **Deterministic:** the same trace always casts the
        same trick.

        **Execution:** local, body-only — no AI, no cloud. The match is computed
        **always** (even offline); the trick fires over WebRTC only when the dog is
        connected (`fired:false` offline).

        **Side effects:** Yugo performs the matched trick (clear space). Fires
        through the trick path (BalanceStand precondition for expressive moves).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpellTrace' }
            examples:
              sweep:
                summary: ~1 s magnetometer sweep sampled at 50 Hz
                value:
                  source: "phone-wand"
                  sample_hz: 50
                  magnetometer: [[0, 12.3, -4.1, 40.2], [20, 12.6, -3.9, 40.5], [40, 13.0, -3.6, 41.0], [60, 13.4, -3.2, 41.6]]
      responses:
        '200':
          description: Spell matched (and fired if the dog is connected).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpellResult' }
              examples:
                cast:
                  value: { ok: true, matched: { bucket: 2, move: "Stretch", api_id: 1017 }, fired: true }
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===========================================================================
  # AUDIO  (delegates-to-mind)
  # ===========================================================================
  /audio/play:
    post:
      tags: [audio]
      operationId: postAudioPlay
      summary: Trigger an ElevenLabs soundscape/SFX/music (PLANNED)
      x-execution: delegates-to-mind
      description: |
        **PLANNED.**

        **What it does:** triggers a soundscape / SFX / music cue by `style` or
        `seed`. The actual audio is **generated mind-side (ElevenLabs)** and
        **played app/laptop-side** — audio bytes never traverse the body. The
        music `style` may also feed `/dance` so motion matches the track.

        **Important:** the **live wand tone** is local Web Audio in the app and
        is NOT this route. This route is for generated soundscape/SFX/music only.

        **Execution:** **delegates-to-mind** — the body relays the cue to the
        mind / app; it does not synthesize or stream audio itself.

        **Side effects:** starts/changes playback on the app or laptop speaker;
        no robot motion (though it may couple to `/dance`).

        **Safety:** no motion; if the mind is unreachable, returns `502`.

        **Latency:** generation/stream start is mind-side (seconds for music);
        the trigger itself is LAN-local. Provide either `style` or `seed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  type: string
                  description: Named music/soundscape style, e.g. "ambient", "dnb".
                seed:
                  type: integer
                  description: Generation seed for reproducibility.
              anyOf:
                - required: [style]
                - required: [seed]
            examples:
              ambient: { value: { style: "ambient" } }
              seeded: { value: { style: "dnb", seed: 42 } }
      responses:
        '200':
          description: Audio cue accepted (generation/playback proceeds mind/app-side).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }
        '502':
          $ref: '#/components/responses/MindUnreachable'

  /audio/stop:
    post:
      tags: [audio]
      operationId: postAudioStop
      summary: Stop the current soundscape/music (PLANNED)
      x-execution: delegates-to-mind
      description: |
        **PLANNED.**

        **What it does:** stops the current mind-generated soundscape/SFX/music
        playback. Does not affect the app's local Web Audio wand tone.

        **Execution:** **delegates-to-mind** — relays the stop to the mind/app
        playback layer.

        **Side effects:** halts audio playback app/laptop-side; no robot motion.

        **Safety:** no motion; `502` if the mind is unreachable.

        **Latency:** LAN-local trigger; playback stops promptly app-side.
      responses:
        '200':
          description: Audio stop accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
              examples:
                ok: { value: { ok: true } }
        '502':
          $ref: '#/components/responses/MindUnreachable'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  # ---- Reusable error / status responses -----------------------------------
  responses:
    RobotNotConnected:
      description: |
        503 — the robot or the WebRTC data channel is not connected. Per hard
        constraint #2 this reflects the **live** channel state; the body is
        auto-reconnecting. Poll `/healthz` and retry once `connected` is true.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notConnected:
              value: { ok: false, error: "robot not connected (ROBOT_IP=192.168.203.75)" }
    UnknownMove:
      description: 404 — the requested move name is not in the SPORT_CMD table.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unknown:
              value: { ok: false, error: "unknown move 'Backflip' — see GET /tricks" }
    MindUnreachable:
      description: |
        502 — the cloud mind is unreachable (network/provider error). The body
        remains safe (reflex/deadman + safe local command set). Retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            mindDown:
              value: { ok: false, error: "mind unreachable" }
    ValidationError:
      description: 422 — request body failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid:
              value: { ok: false, error: "invalid mode 'sleepy'" }

  # ---- Schemas -------------------------------------------------------------
  schemas:

    OkResponse:
      type: object
      description: Generic success acknowledgement.
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    Error:
      type: object
      description: Standard error envelope.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          description: Human-readable error message.

    HealthStatus:
      type: object
      description: |
        Liveness plus the LIVE WebRTC/robot state (`GET /healthz`). `connected`
        MUST reflect the current data-channel state, not just the initial
        handshake (hard constraint #2). This is the hub shape; motion/deadman
        fields live on `GET /state` (`MotionState`).
      required: [ok, connected]
      properties:
        ok:
          type: boolean
          description: The body process is alive.
        robot_ip:
          type: string
          description: The configured ROBOT_IP (DHCP — re-discovered per session).
        connected:
          type: boolean
          description: Live WebRTC connection state to Yugo.
        channel:
          type: string
          enum: [open, connecting, closed]
          description: |
            DEPRECATED-WebBridge / PLANNED — live data-channel state. Not part of
            the hub `/healthz` shape.
        have_frame:
          type: boolean
          description: |
            DEPRECATED-WebBridge only — whether a camera frame has arrived. Not
            part of the hub `/healthz` shape.

    Velocity:
      type: object
      description: |
        Raw teleop command (the `POST /cmd_vel` body). `vx`/`vy` are linear m/s
        (clamped ±0.6), `wz` is yaw rate rad/s (clamped ±1.2). Missing fields
        default to 0.
      properties:
        vx:
          type: number
          description: Forward (+) / back (-) linear velocity, m/s. Clamped to ±0.6.
          default: 0.0
        vy:
          type: number
          description: Left (+) / right (-) strafe velocity, m/s. Clamped to ±0.6.
          default: 0.0
        wz:
          type: number
          description: Yaw rate (CCW +), rad/s. Clamped to ±1.2.
          default: 0.0

    MoveResult:
      type: object
      description: |
        Response of a reflex-teleop call (`/up`,`/down`,`/left`,`/right`,
        `/cmd_vel`,`/stop`). Echoes the velocity the body ACCEPTED (post-clamp).
      required: [ok, action, vx, vy, wz, duration_s, connected]
      properties:
        ok:
          type: boolean
          const: true
        action:
          type: string
          description: Which call produced this (e.g. "up", "cmd_vel", "stop").
        vx:
          type: number
          description: Accepted forward velocity (clamped), m/s.
        vy:
          type: number
          description: Accepted strafe velocity (clamped), m/s.
        wz:
          type: number
          description: Accepted yaw rate (clamped), rad/s.
        duration_s:
          type: number
          description: |
            How long this command holds before the deadman zeroes it (the
            `command_timeout` window; also the nudge duration). Re-call within it
            to keep moving.
        connected:
          type: boolean
          description: Whether the command actually reached the dog (live link).

    MotionState:
      type: object
      description: |
        Live motion + deadman state (`GET /state`). `vx`/`vy`/`wz` are the
        EFFECTIVE (deadman-adjusted) velocity computed at read time; `raw_*` is
        the last commanded velocity before the window is applied.
      required: [moving, vx, vy, wz, raw_vx, raw_vy, raw_wz, deadman_window, connected]
      properties:
        moving:
          type: boolean
          description: True iff the effective velocity is non-zero right now.
        vx: { type: number, description: Effective forward velocity, m/s. }
        vy: { type: number, description: Effective strafe velocity, m/s. }
        wz: { type: number, description: Effective yaw rate, rad/s. }
        raw_vx: { type: number, description: Last commanded forward velocity, m/s. }
        raw_vy: { type: number, description: Last commanded strafe velocity, m/s. }
        raw_wz: { type: number, description: Last commanded yaw rate, rad/s. }
        last_cmd_age_s:
          type: [number, "null"]
          description: Seconds since the last command. Null if none yet.
        deadman_window:
          type: number
          description: The deadman/nudge window in seconds (`command_timeout`).
        connected:
          type: boolean
          description: Live WebRTC connection state.

    ActionInfo:
      type: object
      description: One friendly action route and the SPORT_CMD move it fires.
      required: [name, move, api_id]
      properties:
        name:
          type: string
          description: Friendly route name, reachable as `POST /{name}` (e.g. "wiggle").
        move:
          type: string
          description: Canonical SPORT_CMD move name (e.g. "WiggleHips").
        api_id:
          type: integer
          description: Numeric SPORT_CMD api_id.

    ActionsResponse:
      type: object
      description: The curated friendly action catalog (`GET /actions`).
      required: [actions]
      properties:
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionInfo' }

    TrickResult:
      type: object
      description: |
        Result of publishing a SPORT_CMD move. `ok:true` means PUBLISHED, NOT
        executed (hard constraint #3) — there is no execution ack.
      required: [ok, move]
      properties:
        ok:
          type: boolean
          const: true
        move:
          type: string
          description: The move name that was published.
        api_id:
          type: integer
          description: The numeric SPORT_CMD api_id published to RTC_TOPIC["SPORT_MOD"].

    Vector3:
      type: object
      description: A 3-axis vector.
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }

    MoodState:
      type: object
      description: Aggregated mood used to drive the app's aura and LED color.
      required: [scalar, label, color]
      properties:
        scalar:
          type: number
          minimum: 0
          maximum: 1
          description: Mood intensity / valence, 0..1.
        label:
          type: string
          description: Human-readable mood label, e.g. "curious".
        color:
          type: string
          description: Hex color associated with the mood, e.g. "#ffcc44".

    Detection:
      type: object
      description: A single perception detection (from the mind, delivered via the body).
      required: [label, bbox, confidence]
      properties:
        label:
          type: string
          description: Class label, e.g. "person".
        bbox:
          type: array
          description: Bounding box [x, y, w, h] in pixels.
          items: { type: number }
          minItems: 4
          maxItems: 4
        confidence:
          type: number
          minimum: 0
          maximum: 1

    StateFrame:
      type: object
      description: |
        One push frame on the `/ws/state` WebSocket (~10–20 Hz). Merges robot
        telemetry with mind-sourced perception/mood.
      properties:
        battery:
          type: number
          minimum: 0
          maximum: 1
          description: Battery fraction, 0..1.
        pose:
          type: object
          description: Estimated body pose.
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: number }
            roll: { type: number }
            pitch: { type: number }
            yaw: { type: number }
        imu:
          type: object
          description: IMU readings (linear accel a*, angular rate g*).
          properties:
            ax: { type: number }
            ay: { type: number }
            az: { type: number }
            gx: { type: number }
            gy: { type: number }
            gz: { type: number }
        mode:
          type: string
          enum: [creature, personal, friend, find, wand, meditation]
        mood:
          $ref: '#/components/schemas/MoodState'
        detections:
          type: array
          items: { $ref: '#/components/schemas/Detection' }
        person_count:
          type: integer
          minimum: 0
        audio_level:
          type: number
          minimum: 0
          maximum: 1
          description: Normalized ambient audio level, 0..1.

    SensorReading:
      type: object
      description: A phone "wand" sensor reading (continuous ingest).
      required: [source]
      properties:
        source:
          type: string
          description: Identifier of the sending node, e.g. "phone-wand".
        magnetometer:
          allOf:
            - $ref: '#/components/schemas/Vector3'
          description: Magnetometer reading (µT).
        accel:
          allOf:
            - $ref: '#/components/schemas/Vector3'
          description: Accelerometer reading (m/s²).
        light:
          type: number
          description: Ambient light level (lux).
        gesture:
          type: string
          description: Optional discrete gesture, e.g. "wave", "flick", "hold".
        ts:
          type: number
          description: Optional client timestamp (epoch seconds, float).

    SpellTrace:
      type: object
      description: |
        The magnetometer trace of one wand gesture (press → sweep → release), sent
        to `POST /sensor/spell`. Each sample is `[t_ms, x, y, z]` (ms since hold
        start; magnetometer µT).
      required: [magnetometer]
      properties:
        source:
          type: string
          description: Sending node, e.g. "phone-wand".
        sample_hz:
          type: number
          description: Sampling rate used during the hold (e.g. 50).
        magnetometer:
          type: array
          description: Trace samples `[t_ms, x, y, z]` (µT). 4–2000 samples.
          minItems: 4
          maxItems: 2000
          items:
            type: array
            items: { type: number }
            minItems: 4
            maxItems: 4
        accel:
          type: array
          description: Optional accelerometer trace `[t_ms, x, y, z]` (m/s²); not yet hashed.
          items:
            type: array
            items: { type: number }
            minItems: 4
            maxItems: 4

    SpellResult:
      type: object
      description: The trick a wand gesture matched, and whether it fired on the dog.
      required: [ok, matched, fired]
      properties:
        ok:
          type: boolean
          const: true
        matched:
          type: object
          required: [bucket, move, api_id]
          properties:
            bucket: { type: integer, description: Stable hash bucket the trace fell into. }
            move: { type: string, description: The matched SPORT_CMD move name. }
            api_id: { type: integer, description: The SPORT_CMD api_id for `move`. }
        fired:
          type: boolean
          description: True if the trick was published to the dog (false when offline).

    AgentReply:
      type: object
      description: |
        Reply from the cloud agent plus the behavior the body applied locally.
      required: [reply_text]
      properties:
        reply_text:
          type: string
          description: Short, third-person Yugo line for the app to speak (TTS).
        behavior:
          type: object
          description: The behavior intent the body executed.
          properties:
            type:
              type: string
              enum: [move, trick, led, mode, none]
            name:
              type: string
              description: Move/trick name, mode name, or LED color/effect.
            params:
              type: object
              additionalProperties: true
              description: Optional extra parameters for the behavior.
