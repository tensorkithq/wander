[project]
name = "yugo"
version = "0.0.0"
description = "Yugo — robot/DimOS control layer (laptop bridge + robot utilities) for the Go2 Air."
requires-python = ">=3.12"
dependencies = [
    "dimos==0.0.12.post2",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn WebSocket transport for /ws/state
    "unitree-webrtc-connect-leshy",
    "sqlalchemy>=2.0",
    "alembic",
    "pyyaml",
    # Camera feed relay (MJPEG + WebRTC). av/numpy are transitive via aiortc but
    # the feed code uses them directly, so declare them explicitly.
    "aiortc",
    "av",
    "numpy",
    "pillow",
]

# Application, not a library: the root coordinates flat runnable code
# (fastapi/, scripts/, utils/) — nothing here is meant to be pip-installed,
# so uv does no build/package discovery. This also means app/ (the Node/React
# side, which manages its own toolchain) is never picked up by Python tooling.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
